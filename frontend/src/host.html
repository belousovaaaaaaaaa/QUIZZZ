<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Викторина - Экран учителя</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background: #f0f4f8; color: #333; }
        .screen { border: 2px solid #ccc; padding: 20px; border-radius: 10px; background: white; max-width: 700px; margin: 0 auto; }
        .hidden { display: none !important; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; margin: 10px; background: #2563eb; color: white; border: none; border-radius: 8px; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        #room-display { font-size: 48px; color: #1e40af; font-weight: bold; margin: 20px 0; padding: 10px; border: 3px dashed #2563eb; }
        .question { font-size: 32px; margin: 30px 0; font-weight: bold; }
        .option { font-size: 24px; margin: 12px; padding: 12px; background: #f9fafb; border-radius: 8px; border: 2px solid #cbd5e1; }
        .correct { border-color: #22c55e; background: #f0fdf4; }
        #leaderboard { margin-top: 30px; text-align: left; display: inline-block; }
        #leaderboard h3 { text-align: center; color: #1e40af; }
        #answer-progress { font-size: 24px; font-weight: bold; color: #2563eb; margin: 15px 0; padding: 10px; background: #dbeafe; border-radius: 8px; }
        #auto-advance-warning { font-size: 20px; color: #dc2626; font-weight: bold; margin: 10px 0; animation: pulse 0.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        #final-screen { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px; }
        #final-screen h1 { font-size: 48px; margin: 0 0 20px 0; }
        #final-stats { color: rgba(255,255,255,0.9); margin-bottom: 30px; font-size: 18px; }
        .winner-card { background: rgba(255,255,255,0.2); padding: 15px 20px; border-radius: 12px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; font-size: 20px; }
        .winner-card.first { background: linear-gradient(135deg, #fef3c7 0%, #fcd34d 100%); border: 3px solid #f59e0b; font-size: 24px; font-weight: bold; color: #1f2937; }
        .trophy { font-size: 80px; display: block; margin: 10px 0; }
        #timer-display { font-size: 36px; font-weight: bold; color: #dc2626; margin: 10px 0; }
        #timer-warning { animation: pulse 0.5s infinite; }
        #text-answers-section { display: none; margin-top: 20px; text-align: left; }
        #text-answers-list { max-height: 200px; overflow-y: auto; background: #f8fafc; border-radius: 8px; padding: 10px; }
        .quiz-select { margin: 20px 0; max-height: 300px; overflow-y: auto; text-align: left; }
        .quiz-option { padding: 10px; margin: 5px 0; background: #f0f4f8; border-radius: 6px; cursor: pointer; }
        .quiz-option:hover { background: #dbeafe; }
        .quiz-option.selected { background: #2563eb; color: white; }
    </style>
</head>
<body>
    <h1>🎓 Панель Учителя</h1>
    <p id="status-text" style="color: #666;">Статус: Ожидание...</p>

    <div id="lobby-screen" class="screen">
        <button onclick="showQuizSelect()">✨ Создать новую игру</button>
        <a href="/editor.html" style="display:inline-block;margin:10px;padding:15px 30px;background:#16a34a;color:white;text-decoration:none;border-radius:8px;font-size:18px;">📝 Редактор вопросов</a>
    </div>

    <div id="quiz-select-screen" class="screen hidden">
        <h2>Выберите викторину</h2>
        <div id="quiz-list" class="quiz-select"></div>
        <button onclick="createRoomWithQuestions()" class="success">▶️ Начать с выбранными вопросами</button>
        <button onclick="document.getElementById('quiz-select-screen').classList.add('hidden');document.getElementById('lobby-screen').classList.remove('hidden');" class="secondary">↩️ Назад</button>
    </div>

    <div id="room-screen" class="screen hidden">
        <p>Код комнаты:</p>
        <div id="room-display">---</div>
        <p id="player-count">Игроков: 0</p>
        <button onclick="startGame()" id="start-btn" style="display: none;">🚀 Начать игру</button>
    </div>

    <div id="game-screen" class="screen hidden">
        <div id="timer-display">⏱️ <span id="time-left">15</span> сек</div>
        <div id="answer-progress" style="display: none;">📊 Ответили: <span id="answered-count">0</span>/<span id="total-count">0</span></div>
        <div id="auto-advance-warning" style="display: none;"></div>
        <div id="question-text" class="question">Вопрос...</div>
        <div id="options-container"></div>
        <div id="text-answers-section">
            <h4 style="color:#1e40af;margin-bottom:10px;">📝 Ответы:</h4>
            <div id="text-answers-list"></div>
        </div>
        <div style="margin-top:20px;">
            <button onclick="nextQuestion()" id="next-btn">Следующий вопрос ➡</button>
            <button onclick="endGame()" style="background:#dc2626;margin-left:10px;">🏁 Завершить</button>
        </div>
        <div id="leaderboard">
            <h3>🏆 Таблица лидеров</h3>
            <div id="leaderboard-list"></div>
        </div>
    </div>

    <div id="final-screen" class="screen hidden">
        <span class="trophy">🏆</span>
        <h1>Игра окончена!</h1>
        <p id="final-stats"></p>
        <div id="final-leaderboard"></div>
        <a id="export-btn" href="#" download style="display:none;margin:20px 0;padding:12px 24px;background:#22c55e;color:white;text-decoration:none;border-radius:8px;font-weight:600;">📥 Скачать CSV</a>
        <button onclick="location.reload()" style="margin-top:20px;background:#ffd700;color:#333;">🔄 Новая игра</button>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const API_URL = window.location.origin + '/api';
        const WS_URL = window.location.origin + '/ws';
        const socket = io(WS_URL, { transports: ['websocket'] });
        let currentRoomId = null;
        let selectedQuizId = null;
        let selectedQuestionIds = [];

        socket.on('connect', () => {
            document.getElementById('status-text').innerText = "Статус: Подключено";
        });

        async function loadQuizzes() {
            try {
                const res = await fetch(`${API_URL}/questions`);
                const questions = await res.json();
                const list = document.getElementById('quiz-list');
                list.innerHTML = '<p style="margin-bottom:10px;"><strong>Доступные вопросы:</strong></p>';
                
                questions.forEach(q => {
                    const div = document.createElement('div');
                    div.className = 'quiz-option';
                    div.innerHTML = `<strong>${q.text.substring(0, 50)}${q.text.length > 50 ? '...' : ''}</strong><br><small>Тип: ${q.question_type} | Сложность: ${q.difficulty}</small>`;
                    div.onclick = () => {
                        if (selectedQuestionIds.includes(q.id)) {
                            selectedQuestionIds = selectedQuestionIds.filter(id => id !== q.id);
                            div.classList.remove('selected');
                        } else {
                            selectedQuestionIds.push(q.id);
                            div.classList.add('selected');
                        }
                    };
                    list.appendChild(div);
                });
                
                if (questions.length === 0) {
                    list.innerHTML += '<p style="color:#666;">Нет вопросов. Создайте их в редакторе.</p>';
                }
            } catch (err) {
                console.error(err);
            }
        }

        function showQuizSelect() {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('quiz-select-screen').classList.remove('hidden');
            loadQuizzes();
        }

        function createRoomWithQuestions() {
            socket.emit('create_room', { quizTitle: 'Викторина', questionIds: selectedQuestionIds });
        }

        function createRoom() {
            socket.emit('create_room', { quizTitle: 'Викторина', questionIds: [] });
        }

        socket.on('room_created', ({ roomId }) => {
            currentRoomId = roomId;
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('quiz-select-screen').classList.add('hidden');
            document.getElementById('room-screen').classList.remove('hidden');
            document.getElementById('room-display').innerText = roomId;
        });

        socket.on('player_joined', ({ players }) => {
            document.getElementById('player-count').innerText = `Игроков: ${players.length}`;
            if (players.length > 0) {
                document.getElementById('start-btn').style.display = 'inline-block';
            }
        });

        function startGame() {
            socket.emit('next_question', { roomId: currentRoomId });
            document.getElementById('room-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
        }

        socket.on('show_question_host', (q) => {
            document.getElementById('question-text').innerText = q.text;
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            if (q.type === 'text') {
                document.getElementById('text-answers-section').style.display = 'block';
            } else {
                document.getElementById('text-answers-section').style.display = 'none';
                (q.options || []).forEach((opt, idx) => {
                    const div = document.createElement('div');
                    div.className = 'option';
                    div.innerText = opt;
                    container.appendChild(div);
                });
            }
        });

        socket.on('timer_start', ({ timeLeft }) => {
            document.getElementById('time-left').innerText = timeLeft;
            document.getElementById('timer-display').classList.remove('timer-warning');
        });

        socket.on('timer_update', ({ timeLeft }) => {
            document.getElementById('time-left').innerText = timeLeft;
            if (timeLeft <= 5) {
                document.getElementById('timer-display').classList.add('timer-warning');
            }
        });

        socket.on('answer_progress', ({ answered, total, allAnswered }) => {
            document.getElementById('answer-progress').style.display = 'block';
            document.getElementById('answered-count').innerText = answered;
            document.getElementById('total-count').innerText = total;
        });

        socket.on('update_leaderboard', ({ players }) => {
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '';
            players.slice(0, 5).forEach((p, idx) => {
                list.innerHTML += `<div style="padding:8px;border-bottom:1px solid #eee;"><strong>#${idx+1}</strong> ${p.name} - ${p.score} очков</div>`;
            });
        });

        socket.on('text_answer_received', ({ playerName, answer, isCorrect }) => {
            const list = document.getElementById('text-answers-list');
            const div = document.createElement('div');
            div.style.padding = '5px';
            div.style.borderBottom = '1px solid #eee';
            div.innerHTML = `<strong>${playerName}:</strong> ${answer} ${isCorrect ? '✅' : '❌'}`;
            list.appendChild(div);
            document.getElementById('text-answers-section').style.display = 'block';
        });

        socket.on('auto_advance_warning', ({ delay }) => {
            const warning = document.getElementById('auto-advance-warning');
            warning.innerText = `⏱️ Следующий вопрос через ${delay} сек...`;
            warning.style.display = 'block';
            setTimeout(() => warning.style.display = 'none', delay * 1000);
        });

        function nextQuestion() {
            socket.emit('next_question', { roomId: currentRoomId });
        }

        function endGame() {
            socket.emit('end_game', { roomId: currentRoomId });
        }

        socket.on('game_over', ({ results, totalQuestions, canExport, roomId }) => {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('final-screen').classList.remove('hidden');
            document.getElementById('final-stats').innerText = `Всего вопросов: ${totalQuestions}`;
            
            const leaderboard = document.getElementById('final-leaderboard');
            leaderboard.innerHTML = '';
            results.forEach((r, idx) => {
                const medal = r.medal || '';
                const cardClass = idx === 0 ? 'first' : '';
                leaderboard.innerHTML += `
                    <div class="winner-card ${cardClass}">
                        <span>${medal} #${r.rank} ${r.name}</span>
                        <span>${r.score} очков</span>
                    </div>
                `;
            });

            if (canExport) {
                const exportBtn = document.getElementById('export-btn');
                exportBtn.href = `${API_URL}/results/${roomId}/export`;
                exportBtn.style.display = 'inline-block';
            }
        });

        socket.on('error', (msg) => {
            alert('Ошибка: ' + msg);
        });
    </script>
</body>
</html>

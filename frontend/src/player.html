<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Викторина - Игрок</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; min-height: 100vh; }
        .screen { max-width: 500px; margin: 50px auto; padding: 30px; background: rgba(255,255,255,0.95); border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); color: #333; }
        .hidden { display: none !important; }
        h1 { color: #1e40af; margin-bottom: 30px; }
        input[type="text"] { width: 100%; padding: 15px; font-size: 18px; border: 2px solid #cbd5e1; border-radius: 10px; margin-bottom: 15px; box-sizing: border-box; }
        input:focus { outline: none; border-color: #2563eb; }
        button { width: 100%; padding: 15px; font-size: 18px; cursor: pointer; background: #2563eb; color: white; border: none; border-radius: 10px; margin-top: 10px; transition: all 0.3s; }
        button:hover { background: #1d4ed8; transform: translateY(-2px); }
        button:disabled { background: #9ca3af; cursor: not-allowed; transform: none; }
        .option-btn { padding: 20px; font-size: 18px; margin: 10px 0; background: #f0f4f8; color: #333; border: 2px solid #cbd5e1; }
        .option-btn:hover { background: #dbeafe; }
        .option-btn.selected { background: #2563eb; color: white; border-color: #1e40af; }
        .option-btn.correct { background: #22c55e; color: white; border-color: #16a34a; }
        .option-btn.wrong { background: #dc2626; color: white; border-color: #b91c1c; }
        #timer { font-size: 48px; font-weight: bold; color: #dc2626; margin: 20px 0; }
        #timer.warning { animation: pulse 0.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .feedback { font-size: 24px; font-weight: bold; padding: 20px; border-radius: 10px; margin: 20px 0; }
        .feedback.correct { background: #dcfce7; color: #166534; }
        .feedback.wrong { background: #fee2e2; color: #991b1b; }
        #room-code-display { font-size: 36px; letter-spacing: 5px; font-weight: bold; color: #1e40af; margin: 20px 0; padding: 20px; background: #dbeafe; border-radius: 10px; }
        .result-card { background: rgba(255,255,255,0.2); padding: 15px; border-radius: 10px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .result-card.first { background: linear-gradient(135deg, #fef3c7 0%, #fcd34d 100%); color: #1f2937; font-weight: bold; }
        .medal { font-size: 32px; }
    </style>
</head>
<body>
    <div id="join-screen" class="screen">
        <h1>🎮 Присоединиться к игре</h1>
        <input type="text" id="player-name" placeholder="Ваше имя" maxlength="20">
        <input type="text" id="room-code" placeholder="Код комнаты" maxlength="6" style="text-transform: uppercase; text-align: center; font-size: 24px; letter-spacing: 3px;">
        <button onclick="joinGame()">🚀 Войти</button>
    </div>

    <div id="waiting-screen" class="screen hidden">
        <h1>⏳ Ожидание...</h1>
        <p style="font-size: 18px; margin-bottom: 20px;">Комната:</p>
        <div id="room-code-display">---</div>
        <p id="waiting-message" style="color: #666;">Ждите начала игры...</p>
    </div>

    <div id="question-screen" class="screen hidden">
        <div id="timer">⏱️ <span id="time-left">15</span></div>
        <h2 id="question-text" style="margin: 30px 0; font-size: 24px; color: #1e40af;"></h2>
        <div id="options-container"></div>
        <div id="text-answer-section" class="hidden" style="margin-top: 20px;">
            <input type="text" id="text-answer-input" placeholder="Введите ваш ответ">
            <button onclick="submitTextAnswer()">✅ Отправить</button>
        </div>
        <button id="confirm-btn" onclick="confirmAnswer()" disabled>✅ Подтвердить</button>
        <div id="feedback" class="feedback hidden"></div>
    </div>

    <div id="results-screen" class="screen hidden">
        <h1>🏆 Результаты</h1>
        <div id="final-results"></div>
        <button onclick="location.reload()">🔄 В главное меню</button>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const WS_URL = window.location.origin + '/ws';
        const socket = io(WS_URL, { transports: ['websocket'] });
        
        let currentRoomId = null;
        let playerName = '';
        let selectedAnswer = null;
        let isMultipleChoice = false;

        socket.on('connect', () => {
            console.log('Connected to server');
        });

        function joinGame() {
            playerName = document.getElementById('player-name').value.trim();
            currentRoomId = document.getElementById('room-code').value.trim().toUpperCase();
            
            if (!playerName || !currentRoomId) {
                alert('Введите имя и код комнаты!');
                return;
            }
            
            socket.emit('join_room', { roomId: currentRoomId, playerName: playerName });
        }

        socket.on('joined_success', ({ roomId }) => {
            document.getElementById('join-screen').classList.add('hidden');
            document.getElementById('waiting-screen').classList.remove('hidden');
            document.getElementById('room-code-display').innerText = roomId;
        });

        socket.on('error', (msg) => {
            alert('Ошибка: ' + msg);
        });

        socket.on('show_question_player', ({ id, text, options, type, image }) => {
            selectedAnswer = null;
            document.getElementById('waiting-screen').classList.add('hidden');
            document.getElementById('question-screen').classList.remove('hidden');
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('confirm-btn').disabled = true;
            
            document.getElementById('question-text').innerText = text;
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            const textAnswerSection = document.getElementById('text-answer-section');
            
            if (type === 'text') {
                container.innerHTML = '';
                textAnswerSection.classList.remove('hidden');
                document.getElementById('text-answer-input').value = '';
                document.getElementById('confirm-btn').classList.add('hidden');
            } else {
                textAnswerSection.classList.add('hidden');
                document.getElementById('confirm-btn').classList.remove('hidden');
                isMultipleChoice = type === 'multiple';
                
                options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt;
                    btn.onclick = () => selectOption(idx, btn);
                    container.appendChild(btn);
                });
            }
        });

        function selectOption(idx, btn) {
            if (isMultipleChoice) {
                btn.classList.toggle('selected');
                const selectedBtns = document.querySelectorAll('.option-btn.selected');
                selectedAnswer = Array.from(document.querySelectorAll('.option-btn')).map((b, i) => b.classList.contains('selected') ? i : -1).filter(i => i !== -1);
                document.getElementById('confirm-btn').disabled = selectedAnswer.length === 0;
            } else {
                document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedAnswer = [idx];
                document.getElementById('confirm-btn').disabled = false;
            }
        }

        function submitTextAnswer() {
            const answer = document.getElementById('text-answer-input').value.trim();
            if (!answer) {
                alert('Введите ответ!');
                return;
            }
            socket.emit('confirm_answer', { 
                roomId: currentRoomId, 
                answerData: { textAnswer: answer }
            });
            document.getElementById('text-answer-input').disabled = true;
        }

        function confirmAnswer() {
            if (selectedAnswer === null || selectedAnswer.length === 0) return;
            
            socket.emit('confirm_answer', { 
                roomId: currentRoomId, 
                answerData: { answerIndices: isMultipleChoice ? selectedAnswer : selectedAnswer[0] }
            });
            
            document.getElementById('confirm-btn').disabled = true;
            document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
        }

        socket.on('answer_confirmed', ({ isCorrect }) => {
            const feedback = document.getElementById('feedback');
            feedback.classList.remove('hidden', 'correct', 'wrong');
            feedback.classList.add(isCorrect ? 'correct' : 'wrong');
            feedback.innerHTML = isCorrect ? '✅ Правильно!' : '❌ Неправильно';
        });

        socket.on('timer_start', ({ timeLeft }) => {
            document.getElementById('time-left').innerText = timeLeft;
            document.getElementById('timer').classList.remove('warning');
        });

        socket.on('timer_update', ({ timeLeft }) => {
            document.getElementById('time-left').innerText = timeLeft;
            if (timeLeft <= 5) {
                document.getElementById('timer').classList.add('warning');
            }
        });

        socket.on('time_up', () => {
            document.getElementById('timer').innerText = '⏰ Время вышло!';
            document.getElementById('confirm-btn').disabled = true;
            document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
        });

        socket.on('game_over', ({ results, totalQuestions }) => {
            document.getElementById('question-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.remove('hidden');
            
            const container = document.getElementById('final-results');
            container.innerHTML = `<p style="margin-bottom:20px;font-size:18px;">Всего вопросов: ${totalQuestions}</p>`;
            
            results.forEach((r, idx) => {
                const cardClass = r.rank === 1 ? 'first' : '';
                const medal = r.medal || '';
                container.innerHTML += `
                    <div class="result-card ${cardClass}">
                        <span><span class="medal">${medal}</span> #${r.rank} ${r.name}</span>
                        <span>${r.score} очков</span>
                    </div>
                `;
            });
        });

        // Обработка URL параметров для быстрого подключения
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            const nameParam = urlParams.get('name');
            
            if (roomParam) {
                document.getElementById('room-code').value = roomParam.toUpperCase();
            }
            if (nameParam) {
                document.getElementById('player-name').value = nameParam;
            }
        });
    </script>
</body>
</html>

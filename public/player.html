<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игрок</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: #333; }
        .screen { background: white; border-radius: 20px; padding: 25px; max-width: 500px; margin: 0 auto; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .hidden { display: none !important; }
        input[type="text"] { padding: 15px; font-size: 18px; width: 100%; margin: 10px 0; border: 2px solid #e2e8f0; border-radius: 12px; text-align: center; background: white; color: #333; }
        input[type="text"]:focus { outline: none; border-color: #667eea; }
        input[type="text"]:disabled { background: #e2e8f0; color: #94a3b8; }
        button { padding: 15px 30px; font-size: 18px; width: 100%; margin: 10px 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; }
        button:active { transform: scale(0.98); }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .option-btn { background: white; color: #1f2937; border: 2px solid #667eea; font-weight: 500; text-align: left; padding: 15px 20px; border-radius: 10px; margin: 5px 0; cursor: pointer; transition: all 0.2s; }
        .option-btn:hover { background: #f0f4ff; }
        .option-btn.selected { background: #667eea; color: white; border-color: #4f46e5; }
        .option-btn.selected::after { content: " ✓"; font-weight: bold; }
        #timer-bar { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; margin: 15px 0; overflow: hidden; }
        #timer-fill { height: 100%; background: #22c55e; width: 100%; transition: width 1s linear; }
        #timer-fill.warning { background: #f59e0b; }
        #timer-fill.danger { background: #dc2626; }
        #text-input-section { margin: 20px 0; }
        #final-screen { background: transparent; box-shadow: none; padding: 10px; }
        .trophy { font-size: 80px; display: block; margin: 10px 0; }
        .leaderboard-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; margin: 8px 0; background: #f8fafc; border-radius: 12px; border-left: 4px solid #667eea; }
        .leaderboard-item.first { background: linear-gradient(135deg, #fef3c7 0%, #fcd34d 100%); border-left-color: #f59e0b; border: 2px solid #f59e0b; }
        .rank { font-size: 24px; font-weight: bold; width: 40px; }
        .player-name { flex: 1; text-align: left; padding: 0 15px; font-weight: 500; }
        .player-score { font-size: 20px; font-weight: bold; color: #667eea; min-width: 80px; text-align: right; }
        .your-result { background: #dbeafe; border: 2px solid #3b82f6; border-radius: 12px; padding: 15px; margin: 15px 0; font-weight: 600; }
        #confirm-section { margin-top: 20px; padding-top: 20px; border-top: 2px solid #e2e8f0; }
        #confirm-btn { background: #22c55e; font-size: 20px; padding: 18px 30px; }
        #confirm-btn:hover { background: #16a34a; }
    </style>
</head>
<body>
    <div id="login-screen" class="screen">
        <h1>🎮 Вход в игру</h1>
        <input type="text" id="room-code" placeholder="Код комнаты" maxlength="6" style="text-transform: uppercase;">
        <input type="text" id="player-name" placeholder="Ваше имя">
        <button onclick="joinRoom()">Войти</button>
    </div>
    
    <div id="waiting-screen" class="screen hidden">
        <h2>👋 Привет, <span id="p-name"></span>!</h2>
        <p>Ждём начала игры...</p>
    </div>
    
    <div id="game-screen" class="screen hidden">
        <div id="timer-bar"><div id="timer-fill"></div></div>
        <h3 id="q-text" style="font-size: 22px; margin: 20px 0;"></h3>
        <div id="options-section"><div id="options"></div></div>
        <div id="text-input-section" class="hidden">
            <input type="text" id="text-answer" placeholder="Введите ваш ответ..." maxlength="100" autocomplete="off">
        </div>
        <div id="confirm-section" class="hidden">
            <button id="confirm-btn" onclick="confirmAnswer()" disabled>🔒 Зафиксировать ответ</button>
        </div>
        <div id="answered-message" class="hidden" style="padding: 20px; font-size: 20px; color: #22c55e; font-weight: 600;">✅ Ответ зафиксирован!</div>
    </div>
    
    <div id="final-screen" class="screen hidden">
        <span class="trophy">🏆</span>
        <h1>Игра окончена!</h1>
        <p id="final-stats"></p>
        <div id="your-result" class="your-result hidden"></div>
        <h3 style="text-align: left; margin: 20px 0 10px;">📊 Таблица лидеров</h3>
        <div id="leaderboard-list"></div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myRoom = null, myName = '', selectedAnswers = [], hasAnswered = false, currentQuestionType = 'single';
        const QUESTION_TIME = 15;
        
        function joinRoom() {
            const code = document.getElementById('room-code').value.toUpperCase();
            const name = document.getElementById('player-name').value.trim();
            if (!code || !name) return alert('Заполните все поля!');
            myRoom = code;
            myName = name;
            socket.emit('join_room', { roomId: code, playerName: name });
        }
        
        socket.on('joined_success', () => {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('waiting-screen').classList.remove('hidden');
            document.getElementById('p-name').innerText = myName;
        });
        
        socket.on('timer_start', ({ timeLeft }) => updateTimer(timeLeft));
        socket.on('timer_update', ({ timeLeft }) => updateTimer(timeLeft));
        
        function updateTimer(t) {
            const fill = document.getElementById('timer-fill');
            fill.style.width = (t / QUESTION_TIME * 100) + '%';
            fill.className = t <= 5 ? 'danger' : t <= 10 ? 'warning' : '';
        }
        
        socket.on('show_question_player', (data) => {
    currentQuestionType = data.type || 'single';
    selectedAnswers = [];
    hasAnswered = false;
    
    document.getElementById('waiting-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');
    document.getElementById('q-text').innerText = data.text;
    document.getElementById('answered-message').classList.add('hidden');
    document.getElementById('confirm-section').classList.add('hidden');
    document.getElementById('confirm-btn').disabled = true;
    
    const opts = document.getElementById('options');
    const txt = document.getElementById('text-input-section');
    const input = document.getElementById('text-answer');
    const confirmSection = document.getElementById('confirm-section');
    const confirmBtn = document.getElementById('confirm-btn');
    
    if (currentQuestionType === 'text') {
        // 🔥 ТЕКСТОВЫЙ ВОПРОС
        opts.parentElement.classList.add('hidden');
        txt.classList.remove('hidden');
        confirmSection.classList.remove('hidden'); // 🔥 Показываем секцию подтверждения сразу
        input.value = '';
        input.disabled = false;
        input.style.background = 'white';
        input.style.color = '#333';
        input.focus();
        
        // 🔥 Вешаем обработчик на ввод текста
        input.oninput = function() {
            const hasText = input.value.trim().length > 0;
            confirmBtn.disabled = !hasText;
            if (hasText) {
                confirmBtn.innerText = '🔒 Зафиксировать ответ';
            } else {
                confirmBtn.innerText = '🔒 Зафиксировать ответ';
            }
        };
    } else {
        // 🔥 ВОПРОС С ВЫБОРОМ
        txt.classList.add('hidden');
        opts.parentElement.classList.remove('hidden');
        confirmSection.classList.add('hidden'); // Скрываем пока не выбран ответ
        opts.innerHTML = '';
        (data.options || []).forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectAnswer(idx, btn);
            opts.appendChild(btn);
        });
    }
});
        
        function selectAnswer(idx, btn) {
            if (hasAnswered || currentQuestionType === 'text') return;
            
            if (currentQuestionType === 'single') {
                selectedAnswers = [idx];
                document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
            } else {
                if (selectedAnswers.includes(idx)) {
                    selectedAnswers = selectedAnswers.filter(i => i !== idx);
                    btn.classList.remove('selected');
                } else {
                    selectedAnswers.push(idx);
                    btn.classList.add('selected');
                }
            }
            
            const confirm = document.getElementById('confirm-section');
            const btnConfirm = document.getElementById('confirm-btn');
            
            if (selectedAnswers.length > 0) {
                confirm.classList.remove('hidden');
                btnConfirm.disabled = false;
                btnConfirm.innerText = `🔒 Зафиксировать (${selectedAnswers.length})`;
            } else {
                confirm.classList.add('hidden');
                btnConfirm.disabled = true;
            }
        }
        
        function confirmAnswer() {
            if (hasAnswered) return;
            
            if (currentQuestionType === 'text') {
                const text = document.getElementById('text-answer').value.trim();
                if (!text) return;
                hasAnswered = true;
                socket.emit('confirm_answer', { roomId: myRoom, answerData: { textAnswer: text } });
            } else {
                if (selectedAnswers.length === 0) return;
                hasAnswered = true;
                socket.emit('confirm_answer', { roomId: myRoom, answerData: { answerIndices: [...selectedAnswers] } });
            }
            
            document.getElementById('confirm-section').classList.add('hidden');
            document.getElementById('answered-message').classList.remove('hidden');
            document.querySelectorAll('.option-btn, #text-answer').forEach(el => el.disabled = true);
        }
        
        socket.on('answer_confirmed', () => {});
        
        socket.on('time_up', () => {
            if (!hasAnswered) {
                document.getElementById('confirm-section').classList.add('hidden');
                document.querySelectorAll('.option-btn, #text-answer').forEach(el => el.disabled = true);
            }
        });
        
        socket.on('game_over', ({ results, totalQuestions }) => {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('final-screen').classList.remove('hidden');
            
            const my = results.find(r => r.name === myName);
            if (my) {
                document.getElementById('your-result').classList.remove('hidden');
                document.getElementById('your-result').innerHTML = `${my.medal || '🎯'} Ты на <strong>${my.rank} месте</strong>!<br><span style="font-size:24px;color:#667eea">${my.score} очков</span>`;
            }
            
            document.getElementById('final-stats').innerText = `Вопросов: ${totalQuestions} • Игроков: ${results.length}`;
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '';
            results.forEach((r, i) => {
                const item = document.createElement('div');
                item.className = 'leaderboard-item' + (i === 0 ? ' first' : '');
                item.innerHTML = `<span class="rank">${r.medal || `#${r.rank}`}</span><span class="player-name">${r.name}${r.name === myName ? ' (ты)' : ''}</span><span class="player-score">${r.score}</span>`;
                list.appendChild(item);
            });
        });
    </script>
</body>
</html>
